{% extends "base.html" %}

{% block title %}Home | Philadelphia Phillies{% endblock %}

{% block content %}
<h1>Philadelphia Phillies</h1>
<table>
  <thead>
    <tr>
      {% for column in columns %}
      <th>{{ column }}</th>
      {% endfor %}
    </tr>
  </thead>
  <tbody>
    {% for row in rows %}
    <tr>
      {% for column in columns %}
      <td>{{ row[column] }}</td>
      {% endfor %}
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
